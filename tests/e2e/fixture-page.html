<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:image" content="/cover.svg" />
    <title>神评卡片 E2E Fixture</title>
    <style>
      body { margin: 0; color: #e9eef8; background: #111827; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(760px, calc(100% - 48px)); margin: 48px auto; }
      .reply-container { display: grid; gap: 16px; }
      .reply-item { padding: 20px; border: 2px solid transparent; border-radius: 12px; background: #1f2937; }
      .user-name { color: #8eeeff; }
      .reply-time { margin-left: 12px; color: #9ca3af; }
      .outside { margin-top: 24px; padding: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>评论区</h1>
      <section id="commentapp" class="reply-container" data-testid="comment-root">
        <article class="reply-item" data-testid="comment-item">
          <a class="user-name" data-testid="comment-author">纸飞机</a>
          <span class="reply-time" data-testid="comment-time">2026-08-15</span>
          <p class="reply-content" data-testid="comment-text">历史不是过去的回声，而是今天仍在发生的选择。</p>
        </article>
        <article class="reply-item" data-testid="comment-item">
          <a class="user-name" data-testid="comment-author">云朵</a>
          <span class="reply-time" data-testid="comment-time">2026-08-14</span>
          <p class="reply-content" data-testid="comment-text">确定性 fixture 中的第二条评论。</p>
        </article>
      </section>
      <button type="button" class="outside" data-testid="outside">评论区外按钮</button>
    </main>
    <script>
      const app = document.querySelector('#commentapp');
      const comments = document.createElement('bili-comments');
      app.append(comments);
      const commentsRoot = comments.attachShadow({ mode: 'open' });
      const feed = document.createElement('div');
      feed.id = 'feed';
      commentsRoot.append(feed);
      const thread = document.createElement('bili-comment-thread-renderer');
      feed.append(thread);
      const threadRoot = thread.attachShadow({ mode: 'open' });

      function createComment(tagName, testId, text, authorText, publishedText) {
        const comment = document.createElement(tagName);
        const commentRoot = comment.attachShadow({ mode: 'open' });
        const style = document.createElement('style');
        style.textContent = ':host { display: block; margin-top: 16px; } #body { display: block; padding: 20px; border-radius: 12px; background: #1f2937; }';
        commentRoot.append(style);
        const body = document.createElement('div');
        body.id = 'body';
        commentRoot.append(body);
        const contentHost = document.createElement('bili-rich-text');
        body.append(contentHost);
        const contentRoot = contentHost.attachShadow({ mode: 'open' });
        const content = document.createElement('span');
        content.id = 'contents';
        content.dataset.testid = testId;
        content.textContent = text;
        contentRoot.append(content);
        const user = document.createElement('bili-comment-user-info');
        body.append(user);
        const userRoot = user.attachShadow({ mode: 'open' });
        const author = document.createElement('span');
        author.id = 'user-name';
        author.textContent = authorText;
        userRoot.append(author);
        const actions = document.createElement('bili-comment-action-buttons-renderer');
        body.append(actions);
        const actionsRoot = actions.attachShadow({ mode: 'open' });
        const publishedAt = document.createElement('time');
        publishedAt.id = 'pubdate';
        publishedAt.textContent = publishedText;
        actionsRoot.append(publishedAt);
        return comment;
      }

      const parentComment = createComment('bili-comment-renderer', 'modern-top-comment-text', '默认顶层 Shadow DOM 评论。', '顶层测试用户', '2026-08-15');
      parentComment.id = 'comment';
      threadRoot.append(parentComment);
      const repliesContainer = document.createElement('div');
      repliesContainer.id = 'replies';
      threadRoot.append(repliesContainer);
      const replies = document.createElement('bili-comment-replies-renderer');
      repliesContainer.append(replies);
      const repliesRoot = replies.attachShadow({ mode: 'open' });
      const expander = document.createElement('div');
      expander.id = 'expander';
      repliesRoot.append(expander);
      const expanderContents = document.createElement('div');
      expanderContents.id = 'expander-contents';
      expander.append(expanderContents);
      expanderContents.append(
        createComment('bili-comment-reply-renderer', 'modern-reply-text-1', '默认展示回复一。', '回复测试用户一', '2026-08-14'),
        createComment('bili-comment-reply-renderer', 'modern-reply-text-2', '默认展示回复二。', '回复测试用户二', '2026-08-13'),
      );
    </script>
  </body>
</html>
